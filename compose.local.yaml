#
# Runs the production stack (compose.yaml) on this machine, with all email caught by
# Mailpit instead of a real provider. Use `make local-up`, then open
# https://localhost:8443 (Caddy's local certificate) and http://localhost:8026 (Mailpit).
#
# The app runs in production mode, so it uses the same settings and safety checks as a
# real instance. Production refuses unencrypted SMTP, so Mailpit speaks STARTTLS with a
# certificate from a throwaway local CA (deploy/local/make-certs.sh), which the worker
# is told to trust. Certificate verification stays on.
services:
  caddy:
    # Unprivileged port, so rootless Podman can bind it.
    ports: !override
      - "127.0.0.1:8443:443"
    # Serves the MinIO media bucket at /media/.
    volumes:
      - ./deploy/local/media.caddy:/etc/caddy/extra/media.caddy:ro,z

  app:
    environment:
      # The site is reached on port 8443, not 443.
      PC_PUBLIC_URL: https://localhost:8443
      PC_WEBAUTHN_ORIGINS: https://localhost:8443

  worker:
    environment:
      PC_PUBLIC_URL: https://localhost:8443
      PC_SMTP_CA_FILE: /certs/ca.crt
    volumes:
      - ./deploy/local/certs/ca.crt:/certs/ca.crt:ro,z
    depends_on:
      mailpit:
        condition: service_started

  mailpit:
    image: docker.io/axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    environment:
      MP_SMTP_TLS_CERT: /certs/mailpit.crt
      MP_SMTP_TLS_KEY: /certs/mailpit.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
    volumes:
      - ./deploy/local/certs:/certs:ro,z
    ports:
      # 8026, so it can run alongside the development stack's Mailpit (8025).
      - "127.0.0.1:8026:8025" # web inbox
    networks: [edge]
    restart: unless-stopped

  # Object storage standing in for a hosted provider. MinIO is fine for this
  # throwaway stack (ADR 0010); production uses a hosted or maintained server.
  minio:
    image: cgr.dev/chainguard/minio@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${LOCAL_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${LOCAL_MINIO_PASSWORD}
    volumes:
      - minio-data:/data
    networks: [edge]
    restart: unless-stopped

  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:72d358e57e6e584e80a3497d2bac32d3114da1d6d87232174084d8561b64b686
    depends_on: [minio]
    environment:
      MC_HOST_local: http://${LOCAL_MINIO_USER}:${LOCAL_MINIO_PASSWORD}@minio:9000
    command: ["mb", "--ignore-existing", "local/media", "local/quarantine"]
    networks: [edge]
    restart: on-failure

  minio-policy:
    image: cgr.dev/chainguard/minio-client@sha256:72d358e57e6e584e80a3497d2bac32d3114da1d6d87232174084d8561b64b686
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MC_HOST_local: http://${LOCAL_MINIO_USER}:${LOCAL_MINIO_PASSWORD}@minio:9000
    command: ["anonymous", "set", "download", "local/media"]
    networks: [edge]
    restart: on-failure

volumes:
  minio-data:
