#
# Production deployment (ADR 0009). PREVIEW: backups (ADR 0016) and media storage
# (ADR 0010) are not wired in yet, so don't run a real instance on this until they are.
#
#   cp .env.example .env   # then fill in the values
#   docker compose up -d --build
name: petcommunity

services:
  caddy:
    build:
      context: .
      target: web
    image: petcommunity-web:local
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PC_INSTANCE_DOMAIN: ${PC_INSTANCE_DOMAIN:?set PC_INSTANCE_DOMAIN in .env}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [edge]
    restart: unless-stopped

  app:
    build:
      context: .
      target: app
      args:
        VERSION: ${PC_VERSION:-dev}
    image: petcommunity-app:local
    environment: &app-env
      PC_ENV: production
      PC_INSTANCE_NAME: ${PC_INSTANCE_NAME:?set PC_INSTANCE_NAME in .env}
      PC_INSTANCE_DOMAIN: ${PC_INSTANCE_DOMAIN:?set PC_INSTANCE_DOMAIN in .env}
      PC_SOURCE_URL: ${PC_SOURCE_URL:-https://github.com/chmbrb/PetCommunityProject}
      PC_DATABASE_URL: postgres://petcommunity:${PC_DB_PASSWORD:?set PC_DB_PASSWORD in .env}@db:5432/petcommunity
      # The app is reachable only through Caddy, which sets X-Forwarded-For to the real
      # client address, so rate limits can key on it.
      PC_TRUST_PROXY: "true"
      # Outgoing email through your provider's SMTP server (see .env.example).
      PC_SMTP_HOST: ${PC_SMTP_HOST:?set PC_SMTP_HOST in .env}
      PC_SMTP_PORT: ${PC_SMTP_PORT:-587}
      PC_SMTP_SECURITY: ${PC_SMTP_SECURITY:-starttls}
      PC_SMTP_USERNAME: ${PC_SMTP_USERNAME:-}
      PC_SMTP_PASSWORD: ${PC_SMTP_PASSWORD:-}
      PC_MAIL_FROM: ${PC_MAIL_FROM:?set PC_MAIL_FROM in .env}
      # Media storage (ADR 0010): see .env.example.
      PC_S3_ENDPOINT: ${PC_S3_ENDPOINT:?set PC_S3_ENDPOINT in .env}
      PC_S3_REGION: ${PC_S3_REGION:-us-east-1}
      PC_S3_ACCESS_KEY: ${PC_S3_ACCESS_KEY:?set PC_S3_ACCESS_KEY in .env}
      PC_S3_SECRET_KEY: ${PC_S3_SECRET_KEY:?set PC_S3_SECRET_KEY in .env}
      PC_S3_QUARANTINE_BUCKET: ${PC_S3_QUARANTINE_BUCKET:-quarantine}
      PC_S3_MEDIA_BUCKET: ${PC_S3_MEDIA_BUCKET:-media}
      PC_MEDIA_URL: ${PC_MEDIA_URL:?set PC_MEDIA_URL in .env}
    healthcheck:
      test: ["CMD", "/usr/local/bin/petcommunity", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    read_only: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [edge, backend]
    restart: unless-stopped

  # Runs background jobs: sends email and cleans up expired tokens (ADR 0006).
  worker:
    image: petcommunity-app:local
    command: ["worker"]
    environment:
      <<: *app-env
      # Encrypts actors' private keys (ADR 0012). Only the worker gets it.
      PC_SECRET_KEY: ${PC_SECRET_KEY:?set PC_SECRET_KEY in .env}
    read_only: true
    # Decoding large photos is memory-hungry; contain it (ADR 0011).
    mem_limit: 1g
    depends_on:
      migrate:
        condition: service_completed_successfully
    # edge gives it internet access to reach the SMTP server.
    networks: [edge, backend]
    restart: unless-stopped

  # Applies database migrations before the app starts.
  migrate:
    image: petcommunity-app:local
    command: ["migrate"]
    environment: *app-env
    read_only: true
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  db:
    image: docker.io/postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: petcommunity
      POSTGRES_PASSWORD: ${PC_DB_PASSWORD:?set PC_DB_PASSWORD in .env}
      POSTGRES_DB: petcommunity
    # Continuous archiving (ADR 0016). Each finished WAL file is copied into the spool
    # folder on the backup disk (via a temporary name, so it appears complete or not at
    # all); the backup container encrypts it into the backup store. This container
    # never runs WAL-G or sees the backup key.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal-spool/%f && cp %p /wal-spool/%f.tmp && mv /wal-spool/%f.tmp /wal-spool/%f
      - -c
      - archive_timeout=60
    volumes:
      - db-data:/var/lib/postgresql
      # The Unix socket, shared with the backup container, which has no network.
      - pg-socket:/var/run/postgresql
      - ${PC_BACKUP_DIR:?set PC_BACKUP_DIR in .env}/wal-spool:/wal-spool:z
    healthcheck:
      # TCP check: during first-run initialization Postgres runs a temporary
      # server on the Unix socket only, which would pass a socket check too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U petcommunity -d petcommunity"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      backup-init:
        condition: service_completed_successfully
    networks: [backend]
    restart: unless-stopped

  # Prepares the backup folders on the backup disk with the right owner.
  backup-init:
    build:
      context: .
      target: backup
    image: petcommunity-backup:local
    user: root
    # ":z" lets SELinux hosts (e.g. Fedora) share the folder with containers; other
    # hosts ignore it.
    entrypoint: ["sh", "-c", "mkdir -p /backups/walg /backups/wal-spool && chown 999:999 /backups /backups/walg /backups/wal-spool && chmod 700 /backups/walg /backups/wal-spool"]
    volumes:
      - ${PC_BACKUP_DIR:?set PC_BACKUP_DIR in .env}:/backups:z
    network_mode: none
    restart: "no"

  # Database backups (ADR 0016). No network at all: it reaches Postgres through the
  # shared Unix socket and reads the data files read-only. It alone holds the backup
  # key and writes to the backup store.
  backup:
    image: petcommunity-backup:local
    environment: &backup-env
      PC_BACKUP_KEY: ${PC_BACKUP_KEY:?set PC_BACKUP_KEY in .env}
      PC_BACKUP_APP_DATABASE: petcommunity
      PGUSER: petcommunity
    volumes:
      - db-data:/var/lib/postgresql:ro
      - pg-socket:/var/run/postgresql
      - ${PC_BACKUP_DIR:?set PC_BACKUP_DIR in .env}:/backups:z
      - ${PC_BACKUP_DIR:?set PC_BACKUP_DIR in .env}/wal-spool:/wal-spool:z
      - backup-scratch:/scratch
    healthcheck:
      test: ["CMD", "/usr/local/bin/pc-backup", "health"]
      interval: 60s
      timeout: 20s
      start_period: 15m
    depends_on:
      db:
        condition: service_healthy
    network_mode: none
    restart: unless-stopped

  # Restores the database from backups. Not part of the running stack; see
  # docs/DEVELOPMENT.md ("Restoring from a backup").
  backup-restore:
    image: petcommunity-backup:local
    profiles: [restore]
    command: ["restore"]
    # Starts as root only to move the current data aside, then drops to postgres.
    user: root
    environment: *backup-env
    volumes:
      - db-data:/var/lib/postgresql
      - pg-socket:/var/run/postgresql
      - ${PC_BACKUP_DIR:?set PC_BACKUP_DIR in .env}:/backups:z
    network_mode: none

networks:
  edge: {}
  # The database is unreachable from Caddy and the internet.
  backend:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  db-data:
  pg-socket:
  backup-scratch:
