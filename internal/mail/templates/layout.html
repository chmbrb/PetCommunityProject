{{define "layout_top"}}<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:24px;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#212121;">
<div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:8px;padding:32px;">
<p style="margin:0 0 24px;font-size:14px;color:#2e7d6b;font-weight:600;">{{.InstanceName}}</p>
<p style="margin:0 0 16px;font-size:16px;">Hi {{.DisplayName}},</p>
{{end}}
{{define "layout_bottom"}}<p style="margin:24px 0 0;font-size:13px;color:#616161;">If the button doesn't work, copy this link into your browser:<br><span style="word-break:break-all;">{{.Link}}</span></p>
</div>
</body>
</html>
{{end}}
