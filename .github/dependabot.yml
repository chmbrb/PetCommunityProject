# SPDX-License-Identifier: AGPL-3.0-or-later
# Keeps dependencies, base images, and pinned actions current (THREAT_MODEL.md O1).
version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/tools"]
    schedule: { interval: weekly }
    groups:
      go: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    ignore:
      # Node types must match the Node.js runtime major (26 LTS); move both together, deliberately.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      capacitor: { patterns: ["@capacitor/*"] }
      lint: { patterns: ["eslint*", "@eslint/*", "typescript-eslint", "globals"] }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Runtime majors are upgraded deliberately: Node.js LTS releases only, Go and
      # Postgres alongside the toolchain and data migration they need.
      - dependency-name: "library/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "library/golang"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "postgis/postgis"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "postgis/postgis"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
