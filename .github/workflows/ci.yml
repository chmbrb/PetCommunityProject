# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (THREAT_MODEL.md O2); Dependabot keeps them current.
jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    env:
      # Image codecs must use their memory-safe Go builds only (ADR 0021).
      GOFLAGS: -tags=nodynamic
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: petcommunity
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: petcommunity_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U petcommunity -d petcommunity_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Check generated SQL code is up to date
        run: go tool -modfile=tools/go.mod sqlc diff
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Test (including database integration tests)
        env:
          PC_TEST_DATABASE_URL: postgres://petcommunity:ci-password@localhost:5432/petcommunity_test?sslmode=disable
        run: go test -race ./...
      - name: Vulnerability scan
        run: go tool -modfile=tools/go.mod govulncheck ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build # includes the type check
      - name: Audit dependencies
        run: pnpm audit --prod

  android:
    name: Android (debug build)
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - name: Build web assets and sync into the Android project
        env:
          VITE_DEFAULT_INSTANCE_URL: https://pets.example.org
        run: pnpm build && pnpm exec cap sync android
      - name: Assemble debug APK
        working-directory: web/android
        run: ./gradlew --no-daemon assembleDebug

  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build app image
        run: docker build --target app --build-arg VERSION=${{ github.sha }} -t petcommunity-app:ci .
      - name: Build web image
        run: docker build --target web -t petcommunity-web:ci .
      - name: Smoke test
        run: docker run --rm petcommunity-app:ci version
