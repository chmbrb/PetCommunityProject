# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly full run: dependency and image scans skip unchanged code on pushes, so this
  # catches vulnerabilities published since the code last changed.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions and scanner images are pinned to commit SHAs and digests (THREAT_MODEL.md O2);
# Dependabot keeps the actions current. Every checkout sets persist-credentials: false so
# the job's token isn't left in .git/config for later steps.
env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
  TRIVY_IMAGE: docker.io/aquasec/trivy:0.76.1@sha256:2e6c00d711ab4ae41d8a30c2c1fd3bd3b62704c177bb120f95012e939edfb3df
  ACTIONLINT_IMAGE: docker.io/rhysd/actionlint:1.7.12@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7
  ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.31.1@sha256:cfc533b8fa781c51c6fb4085057945bc3eebb6b6e8a25ab7daa85c885f071269

jobs:
  # Decides which jobs below need to run. Documentation-only changes skip the build
  # and test pipeline; the secret scan always runs.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      images: ${{ steps.filter.outputs.images }}
      deps: ${{ steps.filter.outputs.deps }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: .github/scripts/changes.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the latest commit
          persist-credentials: false
      - name: Scan for committed secrets (gitleaks)
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  go:
    name: Go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      # Image codecs must use their memory-safe Go builds only (ADR 0021).
      GOFLAGS: -tags=nodynamic
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: petcommunity
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: petcommunity_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U petcommunity -d petcommunity_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Check generated SQL code is up to date
        run: go tool -modfile=tools/go.mod sqlc diff
      - name: Lint (including gosec security checks)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Test (including database integration tests)
        env:
          PC_TEST_DATABASE_URL: postgres://petcommunity:ci-password@localhost:5432/petcommunity_test?sslmode=disable
        run: go test -race ./...
      - name: Vulnerability scan (reachable code)
        run: go tool -modfile=tools/go.mod govulncheck ./...

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build # includes the type check
      - name: Audit dependencies
        run: pnpm audit --prod

  android:
    name: Android (debug build)
    needs: [changes, web]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - name: Build web assets and sync into the Android project
        env:
          VITE_DEFAULT_INSTANCE_URL: https://pets.example.org
        run: pnpm build && pnpm exec cap sync android
      - name: Assemble debug APK
        working-directory: web/android
        run: ./gradlew --no-daemon assembleDebug

  images:
    name: Container images
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Dockerfile and deployment config for misconfigurations
        run: >-
          docker run --rm -v "$PWD:/repo:ro" "$TRIVY_IMAGE" config --quiet
          --severity HIGH,CRITICAL --exit-code 1 /repo
      - name: Build images
        env:
          VERSION: ${{ github.sha }}
        run: |
          docker build --pull --target app --build-arg VERSION="$VERSION" -t petcommunity-app:ci .
          docker build --pull --target web -t petcommunity-web:ci .
          docker build --pull --target db -t petcommunity-db:ci .
          docker build --pull --target backup -t petcommunity-backup:ci .
      - name: Smoke test
        run: |
          docker run --rm petcommunity-app:ci version
          docker run --rm --entrypoint wal-g petcommunity-backup:ci --version
      # Operating-system packages in our images can always be fixed by rebuilding (the
      # Dockerfile upgrades them), so fixable HIGH/CRITICAL ones fail the build. Libraries
      # inside third-party binaries (Caddy, gosu, WAL-G) only get fixed by upstream
      # releases, so they're reported but don't block; our own Go code is covered by
      # govulncheck in the Go job.
      - name: Scan images (OS packages; fails on fixable HIGH/CRITICAL)
        run: |
          mkdir -p scan
          for image in app web db backup; do
            docker save -o "scan/$image.tar" "petcommunity-$image:ci"
            echo "::group::petcommunity-$image"
            docker run --rm -v "$PWD/scan:/scan:ro" "$TRIVY_IMAGE" image --quiet \
              --input "/scan/$image.tar" --pkg-types os --ignore-unfixed \
              --severity HIGH,CRITICAL --exit-code 1
            echo "::endgroup::"
          done
      - name: Report library vulnerabilities in third-party binaries (non-blocking)
        if: always()
        run: |
          for image in web backup; do
            [ -f "scan/$image.tar" ] || continue
            {
              echo "### petcommunity-$image: libraries in bundled binaries"
              echo '```'
              docker run --rm -v "$PWD/scan:/scan:ro" "$TRIVY_IMAGE" image --quiet \
                --input "/scan/$image.tar" --pkg-types library --ignore-unfixed \
                --severity HIGH,CRITICAL --format table
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          done

  dependencies:
    name: Dependency scan
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Covers every lockfile, including the tools module and dev dependencies that
      # govulncheck and pnpm audit --prod don't look at.
      - name: Scan lockfiles for known vulnerabilities
        run: >-
          docker run --rm -v "$PWD:/repo:ro" "$TRIVY_IMAGE" fs --quiet --scanners vuln
          --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 /repo

  dependency-review:
    name: Dependency review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Block pull requests that add vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  workflows:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE"
      - name: Audit workflow security (zizmor)
        run: docker run --rm -v "$PWD:/repo:ro" "$ZIZMOR_IMAGE" --offline --min-severity medium /repo/.github/workflows

  # The single check to require in branch protection. Skipped jobs (unchanged areas)
  # count as passing; any failure or cancellation fails it.
  result:
    name: CI result
    if: always()
    needs: [changes, secrets, go, web, android, images, dependencies, dependency-review, workflows]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) echo "A required job did not pass ($r)."; exit 1 ;; esac
          done
