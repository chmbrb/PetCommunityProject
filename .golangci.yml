version: "2"

run:
  # Image codecs must build without their C shared-library path (ADR 0021).
  build-tags: [nodynamic]

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert
  settings:
    errcheck:
      # Writes to stdout/stderr and closing read-side resources can't usefully be handled.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.ReadCloser).Close
        - (*database/sql.DB).Close
    gosec:
      excludes:
        - G104 # unhandled errors: covered by errcheck, with the exclusions above
  exclusions:
    generated: strict
    rules:
      # Tests may use simplified error handling and fixed inputs.
      - path: _test\.go
        linters: [gosec, noctx]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/chmbrb/PetCommunityProject
